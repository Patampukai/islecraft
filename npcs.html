<style>
main.wrap{width:min(1400px,calc(100% - 32px));margin:28px auto 60px}
.races-intro{margin-bottom:24px}
.race-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;align-items:start}
.race-column{min-width:0}
.race-photo-box{overflow:hidden;aspect-ratio:3/4;min-height:180px;background:#1b2a20;border:2px solid #e9c879;border-radius:8px;box-shadow:0 6px 18px #0005}
.race-photo-box img{display:block;width:100%;height:100%;object-fit:cover}
.race-photo-placeholder{height:100%;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box;color:#e9c879;text-align:center}
.race-photo-placeholder .placeholder-icon{font-size:34px}
.race-photo-placeholder small{color:#d2d8d1;line-height:1.5}
.race-info-box{margin-top:12px;padding:16px;background:#1b2a20;border:1px solid #8e7948;border-radius:8px;box-shadow:0 6px 18px #0004;overflow-wrap:anywhere}
.race-info-box h3{margin:0 0 12px;color:#e9c879;font-size:1.1rem}
.race-stats{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 16px}
.race-stat{display:flex;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid #ffffff18}
.race-stat dt{color:#c7d0c7}.race-stat dd{margin:0;color:#fff0c4;font-weight:700;text-align:right}
.race-ability{margin-top:10px;padding-top:12px;border-top:1px solid #e9c87966}
.race-ability h4{margin:0 0 6px;color:#e9c879;font-size:.95rem}
.race-ability p{margin:0;line-height:1.55;color:#d2d8d1;font-size:.92rem}
@media(max-width:1100px){.race-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.race-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.race-info-box{padding:12px}}
@media(max-width:440px){.race-grid{grid-template-columns:1fr}.race-photo-box{aspect-ratio:16/9}}
</style>
</head>
